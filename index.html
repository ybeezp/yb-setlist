<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YB SETLIST ARCHIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}header{padding:20px;border-bottom:1px solid #222;font-weight:900;font-size:22px;position:sticky;top:0;background:#080808}header b,.red{color:#ff3045}main{padding:35px 20px;max-width:650px;margin:auto}.hero{padding:25px 0 35px}.hero small{color:#777}.hero h1{font-size:42px;line-height:1;margin:12px 0}.hero p{color:#999;line-height:1.6}.stats{display:flex;border-block:1px solid #292929;margin-bottom:28px}.stat{flex:1;text-align:center;padding:18px 3px}.stat+ .stat{border-left:1px solid #292929}.stat strong{display:block;font-size:23px}.stat span{font-size:11px;color:#777}input{width:100%;padding:16px 18px;border-radius:30px;border:1px solid #444;background:#151515;color:white;font-size:15px}.filters{display:flex;gap:7px;overflow:auto;padding:16px 0 28px}.filters button{white-space:nowrap;border:1px solid #333;border-radius:30px;padding:9px 14px;background:#151515;color:#bbb}.filters .on{background:#ff3045;color:white;border-color:#ff3045}.card{border:1px solid #292929;background:#111;padding:18px;border-radius:12px;margin-bottom:12px}.date{color:#ff3045;font-size:13px;font-weight:bold}.card h3{margin:7px 0}.meta{color:#888;font-size:13px;line-height:1.6}.tag{display:inline-block;background:#252525;color:#aaa;padding:5px 9px;border-radius:20px;font-size:11px;margin-top:9px}#detail{display:none}.back{background:none;border:0;color:#aaa;padding:0;margin-bottom:25px;font-size:15px}.song{display:flex;border-bottom:1px solid #222;padding:13px 0}.num{color:#ff3045;width:42px;font-weight:bold}.set{margin-top:35px;border-bottom:1px solid #333;padding-bottom:12px}footer{text-align:center;color:#555;font-size:11px;padding:40px}
</style>
</head>
<body>
<header>YB <b>SETLIST</b> ARCHIVE</header>
<main>
<section id="home">
<div class="hero">
<small>YB PERFORMANCE ARCHIVE</small>
<h1>EVERY STAGE.<br>EVERY <span class="red">SONG.</span></h1>
<p>YB의 무대와 그날의 노래를 기록합니다.<br>공연별 셋리스트를 찾아보세요.</p>
</div>

<div class="stats">
<div class="stat"><strong id="cc">0</strong><span>등록 공연</span></div>
<div class="stat"><strong id="sc">0</strong><span>수록 곡</span></div>
<div class="stat"><strong id="yc">0</strong><span>기록 연도</span></div>
</div>

<input id="q" placeholder="곡명 또는 공연명을 검색하세요">

<div class="filters">
<button class="on" onclick="ft('전체',this)">전체</button>
<button onclick="ft('단독공연',this)">단독공연</button>
<button onclick="ft('페스티벌',this)">페스티벌</button>
<button onclick="ft('대학축제',this)">대학축제</button>
<button onclick="ft('행사',this)">행사</button>
</div>

<h2>공연 기록</h2>
<div id="list"></div>
</section>

<section id="detail">
<button class="back" onclick="back()">← 공연 목록</button>
<div class="date" id="dd"></div>
<h1 id="dt"></h1>
<div class="meta" id="dm"></div>
<h2 class="set">SETLIST</h2>
<div id="songs"></div>
</section>
</main>

<footer>UNOFFICIAL YB FAN ARCHIVE</footer>

<script>
const data=[
["2026.09.17","안녕?여름, 안녕?가을 계룡 축제","계룡","행사",["박하사탕","나는 나비","잊을게","사랑했나봐","담배가게 아가씨","Rebellion","흰수염고래","It Burns"]]
];

let type="전체";
const list=document.querySelector("#list"),q=document.querySelector("#q");

function draw(){
let k=q.value.toLowerCase();
list.innerHTML="";
data.forEach((x,i)=>{
if((type=="전체"||x[3]==type)&&(x[1].toLowerCase().includes(k)||x[4].some(s=>s.toLowerCase().includes(k)))){
list.innerHTML+=`<div class="card" onclick="openC(${i})"><div class="date">${x[0]}</div><h3>${x[1]}</h3><div class="meta">${x[2]} · ${x[4].length}곡</div><span class="tag">${x[3]}</span></div>`
}});
if(!list.innerHTML)list.innerHTML='<p class="meta">검색 결과가 없습니다.</p>'
}

function ft(t,b){
type=t;
document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("on"));
b.classList.add("on");
draw()
}

function openC(i){
let x=data[i];
home.style.display="none";
detail.style.display="block";
dd.innerText=x[0];
dt.innerText=x[1];
dm.innerText=x[2]+" · "+x[3];
songs.innerHTML=x[4].map((s,n)=>`<div class="song"><span class="num">${String(n+1).padStart(2,"0")}</span>${s}</div>`).join("");
scrollTo(0,0)
}

function back(){
detail.style.display="none";
home.style.display="block";
scrollTo(0,0)
}

q.oninput=draw;
cc.innerText=data.length;
sc.innerText=new Set(data.flatMap(x=>x[4])).size;
yc.innerText=new Set(data.map(x=>x[0].slice(0,4))).size;
draw();
</script>
</body>
</html>
