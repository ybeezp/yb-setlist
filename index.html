<meta charset="utf-8">

<title>YB SETLIST ARCHIVE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080808;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans KR",Arial,sans-serif;
}

header{
  padding:26px 22px;
  border-bottom:1px solid #242424;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

header b{color:#ff3045}

main{
  max-width:760px;
  margin:auto;
  padding:0 22px 60px;
}

/* 메인 */

.hero{
  padding:55px 0 45px;
}

.yb-logo{
  display:block;
  width:90px;
  height:auto;
  margin-bottom:32px;
}

.hero small{
  display:block;
  color:#777;
  font-size:14px;
  margin-bottom:16px;
}

.hero h1{
  margin:0;
  font-size:46px;
  line-height:1.02;
  letter-spacing:-2px;
}

.red{color:#ff3045}

.hero p{
  color:#8d8d8d;
  font-size:17px;
  line-height:1.8;
  margin:24px 0 0;
}

/* 상단 통계 */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid #292929;
  border-bottom:1px solid #292929;
  margin-bottom:30px;
}

.stat{
  text-align:center;
  padding:24px 10px;
}

.stat+.stat{
  border-left:1px solid #292929;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:7px;
}

.stat span{
  color:#777;
  font-size:14px;
}

/* 검색 */

.search{
  width:100%;
  background:#171717;
  border:1px solid #444;
  color:white;
  padding:18px 20px;
  border-radius:40px;
  font-size:16px;
  outline:none;
}

.search::placeholder{color:#777}

/* 필터 */

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:17px 0 40px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filters button{
  flex:none;
  border:1px solid #383838;
  background:#171717;
  color:#aaa;
  padding:12px 18px;
  border-radius:30px;
  font-size:15px;
  cursor:pointer;
}

.filters button.on{
  background:#ff3045;
  border-color:#ff3045;
  color:white;
}

/* 제목 */

.section-title{
  font-size:27px;
  margin:0 0 24px;
}

/* 곡별 통계 */

.song-stats-section{
  margin-bottom:55px;
}

.song-stats{
  border-top:1px solid #292929;
}

.song-stat{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 2px;
  border-bottom:1px solid #292929;
}

.song-rank{
  width:32px;
  flex:none;
  color:#666;
  font-size:13px;
  font-weight:700;
}

.song-stat-name{
  flex:1;
  font-size:16px;
  line-height:1.4;
}

.song-stat-count{
  flex:none;
  color:#ff3045;
  font-size:15px;
  font-weight:700;
}

.stats-more{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:1px solid #383838;
  border-radius:30px;
  background:#171717;
  color:#aaa;
  font-size:15px;
  cursor:pointer;
}

/* 공연 목록 */

.card{
  border:1px solid #292929;
  border-radius:15px;
  padding:22px;
  margin-bottom:14px;
  cursor:pointer;
  background:#0c0c0c;
}

.card:active{
  background:#151515;
}

.card .date{
  color:#ff3045;
  font-size:14px;
  font-weight:700;
  margin-bottom:9px;
}

.card h3{
  margin:0 0 9px;
  font-size:20px;
  line-height:1.4;
}

.card p{
  margin:0;
  color:#777;
  font-size:14px;
  line-height:1.6;
}

/* 공연 상세 */

#detail{
  display:none;
  padding-top:38px;
}

.back{
  color:#aaa;
  font-size:17px;
  margin-bottom:35px;
  cursor:pointer;
  display:inline-block;
}

.detail-date{
  color:#ff3045;
  font-size:15px;
  font-weight:700;
  margin-bottom:18px;
}

#detail h1{
  font-size:32px;
  line-height:1.25;
  margin:0 0 20px;
}

.detail-info{
  color:#888;
  font-size:15px;
  line-height:1.8;
  margin-bottom:30px;
}

/* 공연 사진 */

.concert-img{
  display:block;
  width:100%;
  height:auto;
  border-radius:14px;
  margin:0 0 40px;
}

/* 셋리스트 */

.set-title{
  font-size:25px;
  margin-bottom:18px;
}

.song{
  display:flex;
  align-items:center;
  border-top:1px solid #292929;
  padding:18px 0;
}

.song:last-child{
  border-bottom:1px solid #292929;
}

.song-num{
  color:#ff3045;
  width:48px;
  flex:none;
  font-size:17px;
  font-weight:700;
}

.song-name{
  font-size:17px;
}

.empty{
  color:#777;
  padding:20px 0;
}

/* 푸터 */

footer{
  max-width:760px;
  margin:auto;
  padding:30px 22px 45px;
  color:#555;
  font-size:12px;
}
</style>

/* 기본 변수 */

/* 날짜를 숫자로 변환 */

function getDateValue(dateText){

  const match=
    dateText.match(
      /(\d{4})\.(\d{2})\.(\d{2})/
    );

  if(!match){
    return 0;
  }

  return new Date(
    Number(match[1]),
    Number(match[2])-1,
    Number(match[3])
  ).getTime();

}


/* 공연 목록 그리기 */

function draw(){

  const k=
    q.value.toLowerCase();

  list.innerHTML="";

  /*
  데이터가 코드상 어디에 있든
  화면에서는 최신 공연부터 자동 정렬
  */

  const sortedData=
    data
      .map((x,i)=>({x,i}))
      .sort(
        (a,b)=>
          getDateValue(b.x[0])-
          getDateValue(a.x[0])
      );


  sortedData.forEach(({x,i})=>{

    const searchText=
      (
        x[0]+" "+
        x[1]+" "+
        x[2]+" "+
        x[3]+" "+
        x[4]+" "+
        x[6].join(" ")
      ).toLowerCase();


    if(
      (type==="전체" || x[4]===type)
      &&
      searchText.includes(k)
    ){

      list.innerHTML+=`

        <div
          class="card"
          onclick="openC(${i})"
        >

          <div class="date">
            ${x[0]}
          </div>

          <h3>
            ${x[1]}
          </h3>

          <p>
            ${x[2]} · ${x[3]} · ${x[4]}
          </p>

        </div>

      `;

    }

  });


  if(!list.innerHTML){

    list.innerHTML=
      '<p class="empty">검색 결과가 없습니다.</p>';

  }

}


/* 공연 종류 필터 */

function ft(t,b){

  type=t;

  document
    .querySelectorAll(".filters button")
    .forEach(
      x=>x.classList.remove("on")
    );

  b.classList.add("on");

  draw();

}


/* 공연 상세 */

function openC(i){

  const x=data[i];

  home.style.display="none";
  detail.style.display="block";

  dd.innerText=x[0];
  dt.innerText=x[1];

  dm.innerHTML=
    `${x[2]}<br>${x[3]} · ${x[4]}`;


  /* 공연 사진 */

  if(x[5]){

    concertImg.src=x[5];
    concertImg.alt=x[1]+" 대표 사진";
    concertImg.style.display="block";

  }else{

    concertImg.removeAttribute("src");
    concertImg.style.display="none";

  }


  /* 셋리스트 */

  songs.innerHTML=
    x[6]
      .map((s,n)=>`

        <div class="song">

          <div class="song-num">
            ${String(n+1).padStart(2,"0")}
          </div>

          <div class="song-name">
            ${s}
          </div>

        </div>

      `)
      .join("");


  window.scrollTo(0,0);

}


/* 공연 상세 → 메인 */

function back(){

  detail.style.display="none";
  home.style.display="block";

  window.scrollTo(0,0);

}


/* 곡별 공연 횟수 */

function makeSongStats(){

  const counts={};


  data.forEach(concert=>{

    /*
    같은 공연에서 같은 곡이
    두 번 입력되어 있어도 1회로 계산
    */

    const uniqueSongs=
      new Set(concert[6]);


    uniqueSongs.forEach(song=>{

      if(!counts[song]){
        counts[song]=0;
      }

      counts[song]++;

    });

  });


  /*
  1. 공연 횟수 많은 순
  2. 같은 횟수면 곡명 순
  */

  const ranking=
    Object.entries(counts)
      .sort((a,b)=>{

        if(b[1]!==a[1]){
          return b[1]-a[1];
        }

        return a[0].localeCompare(
          b[0],
          "ko"
        );

      });


  /*
  기본은 TOP 10
  전체보기 누르면 전곡
  */

  const visible=
    showAllSongStats
      ? ranking
      : ranking.slice(0,10);


  songStats.innerHTML=
    visible
      .map(([song,count],index)=>`

        <div class="song-stat">

          <div class="song-rank">
            ${String(index+1).padStart(2,"0")}
          </div>

          <div class="song-stat-name">
            ${song}
          </div>

          <div class="song-stat-count">
            ${count}회
          </div>

        </div>

      `)
      .join("");


  if(ranking.length<=10){

    statsMore.style.display="none";

  }else{

    statsMore.style.display="block";

    statsMore.innerText=
      showAllSongStats
        ? "접기"
        : `전체 보기 (${ranking.length}곡)`;

  }

}


/* 곡별 통계 전체보기 */

function toggleSongStats(){

  showAllSongStats=
    !showAllSongStats;

  makeSongStats();

}
