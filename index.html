<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YB SETLIST ARCHIVE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans KR",Arial,sans-serif;
}

header{
  padding:26px 22px;
  border-bottom:1px solid #242424;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

header b{
  color:#ff3045;
}

main{
  max-width:760px;
  margin:auto;
  padding:0 22px 60px;
}

/* 메인 */

.hero{
  padding:55px 0 45px;
}

.yb-logo{
  display:block;
  width:90px;
  height:auto;
  margin-bottom:32px;
}

.hero small{
  display:block;
  color:#777;
  font-size:14px;
  margin-bottom:16px;
}

.hero h1{
  margin:0;
  font-size:46px;
  line-height:1.02;
  letter-spacing:-2px;
}

.red{
  color:#ff3045;
}

.hero p{
  color:#8d8d8d;
  font-size:17px;
  line-height:1.8;
  margin:24px 0 0;
}

/* 통계 */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid #292929;
  border-bottom:1px solid #292929;
  margin-bottom:30px;
}

.stat{
  text-align:center;
  padding:24px 10px;
}

.stat+.stat{
  border-left:1px solid #292929;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:7px;
}

.stat span{
  color:#777;
  font-size:14px;
}

/* 검색 */

.search{
  width:100%;
  background:#171717;
  border:1px solid #444;
  color:white;
  padding:18px 20px;
  border-radius:40px;
  font-size:16px;
  outline:none;
}

.search::placeholder{
  color:#777;
}

/* 필터 */

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:17px 0 40px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filters button{
  flex:none;
  border:1px solid #383838;
  background:#171717;
  color:#aaa;
  padding:12px 18px;
  border-radius:30px;
  font-size:15px;
}

.filters button.on{
  background:#ff3045;
  border-color:#ff3045;
  color:white;
}

/* 공연 목록 */

.section-title{
  font-size:27px;
  margin:0 0 24px;
}

.card{
  border:1px solid #292929;
  border-radius:15px;
  padding:22px;
  margin-bottom:14px;
  cursor:pointer;
  background:#0c0c0c;
}

.card:active{
  background:#151515;
}

.card .date{
  color:#ff3045;
  font-size:14px;
  font-weight:700;
  margin-bottom:9px;
}

.card h3{
  margin:0 0 9px;
  font-size:20px;
}

.card p{
  margin:0;
  color:#777;
  font-size:14px;
  line-height:1.6;
}

/* 상세 */

#detail{
  display:none;
  padding-top:38px;
}

.back{
  color:#aaa;
  font-size:17px;
  margin-bottom:35px;
  cursor:pointer;
  display:inline-block;
}

.detail-date{
  color:#ff3045;
  font-size:15px;
  font-weight:700;
  margin-bottom:18px;
}

#detail h1{
  font-size:32px;
  line-height:1.25;
  margin:0 0 20px;
}

.detail-info{
  color:#888;
  font-size:15px;
  line-height:1.8;
  margin-bottom:30px;
}

/* 공연 대표사진 */

.concert-img{
  display:block;
  width:100%;
  height:auto;
  border-radius:14px;
  margin:0 0 40px;
}

.set-title{
  font-size:25px;
  margin-bottom:18px;
}

.song{
  display:flex;
  align-items:center;
  border-top:1px solid #292929;
  padding:18px 0;
}

.song:last-child{
  border-bottom:1px solid #292929;
}

.song-num{
  color:#ff3045;
  width:48px;
  flex:none;
  font-size:17px;
  font-weight:700;
}

.song-name{
  font-size:17px;
}

.empty{
  color:#777;
  padding:20px 0;
}

/* 푸터 */

footer{
  max-width:760px;
  margin:auto;
  padding:30px 22px 45px;
  color:#555;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  YB <b>SETLIST</b> ARCHIVE
</header>

<main>

<section id="home">

  <div class="hero">

    <img
      src="yb.logo.png"
      alt="YB Logo"
      class="yb-logo"
    >

    <small>
      2026 YB PERFORMANCE ARCHIVE
    </small>

    <h1>
      LIVE SETLIST<br>
      <span class="red">ARCHIVE.</span>
    </h1>

    <p>
      2026년 YB 공연 셋리스트를 기록합니다.<br>
      공연명 또는 곡명으로 찾아보세요.
    </p>

  </div>

  <div class="stats">

    <div class="stat">
      <strong id="cc">0</strong>
      <span>등록 공연</span>
    </div>

    <div class="stat">
      <strong id="sc">0</strong>
      <span>수록 곡</span>
    </div>

  </div>

  <input
    id="q"
    class="search"
    placeholder="곡명 또는 공연명을 검색하세요"
  >

  <div class="filters">

    <button class="on" onclick="ft('전체',this)">
      전체
    </button>

    <button onclick="ft('단독공연',this)">
      단독공연
    </button>

    <button onclick="ft('페스티벌',this)">
      페스티벌
    </button>

    <button onclick="ft('대학축제',this)">
      대학축제
    </button>

    <button onclick="ft('행사',this)">
      행사
    </button>

  </div>

  <h2 class="section-title">
    공연 기록
  </h2>

  <div id="list"></div>

</section>


<section id="detail">

  <div class="back" onclick="back()">
    ← 공연 목록
  </div>

  <div
    id="dd"
    class="detail-date">
  </div>

  <h1 id="dt"></h1>

  <div
    id="dm"
    class="detail-info">
  </div>

  <img
    id="concert-img"
    class="concert-img"
    alt="공연 대표 사진"
  >

  <h2 class="set-title">
    SETLIST
  </h2>

  <div id="songs"></div>

</section>

</main>


<footer>
  UNOFFICIAL YB FAN ARCHIVE
</footer>

let type="전체";

const list=document.querySelector("#list");
const q=document.querySelector("#q");
const home=document.querySelector("#home");
const detail=document.querySelector("#detail");

const dd=document.querySelector("#dd");
const dt=document.querySelector("#dt");
const dm=document.querySelector("#dm");
const concertImg=document.querySelector("#concert-img");
const songs=document.querySelector("#songs");

const cc=document.querySelector("#cc");
const sc=document.querySelector("#sc");


function draw(){

  const k=q.value.toLowerCase();

list.innerHTML="";

const sortedData = data
  .map((x,i)=>({x,i}))
  .sort((a,b)=>{
    const dateA=a.x[0].slice(0,10).replaceAll(".","-");
    const dateB=b.x[0].slice(0,10).replaceAll(".","-");
    return dateB.localeCompare(dateA);
  });

sortedData.forEach(({x,i})=>{

    const searchText=
      (
        x[0]+" "+
        x[1]+" "+
        x[2]+" "+
        x[3]+" "+
        x[4]+" "+
        x[6].join(" ")
      ).toLowerCase();

    if(
      (type==="전체" || x[4]===type)
      &&
      searchText.includes(k)
    ){

      list.innerHTML+=`
        <div class="card" onclick="openC(${i})">

          <div class="date">
            ${x[0]}
          </div>

          <h3>
            ${x[1]}
          </h3>

          <p>
            ${x[2]} · ${x[3]} · ${x[4]}
          </p>

        </div>
      `;

    }

  });

  if(!list.innerHTML){
    list.innerHTML=
      '<p class="empty">검색 결과가 없습니다.</p>';
  }

}


function ft(t,b){

  type=t;

  document
    .querySelectorAll(".filters button")
    .forEach(x=>x.classList.remove("on"));

  b.classList.add("on");

  draw();

}


function openC(i){

  const x=data[i];

  home.style.display="none";
  detail.style.display="block";

  dd.innerText=x[0];
  dt.innerText=x[1];

  dm.innerHTML=
    `${x[2]}<br>${x[3]} · ${x[4]}`;

  /* 대표사진 */

  if(x[5]){
    concertImg.src=x[5];
    concertImg.alt=x[1]+" 대표 사진";
    concertImg.style.display="block";
  }else{
    concertImg.removeAttribute("src");
    concertImg.style.display="none";
  }

  /* 셋리스트 */

  songs.innerHTML=
    x[6]
      .map((s,n)=>`
        <div class="song">

          <div class="song-num">
            ${String(n+1).padStart(2,"0")}
          </div>

          <div class="song-name">
            ${s}
          </div>

        </div>
      `)
      .join("");

  window.scrollTo(0,0);

}


function back(){

  detail.style.display="none";
  home.style.display="block";

  window.scrollTo(0,0);

}


q.oninput=draw;


/* 통계 */

cc.innerText=data.length;

sc.innerText=
  new Set(
    data.flatMap(x=>x[6])
  ).size;


draw();
