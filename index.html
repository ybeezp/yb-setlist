<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YB SETLIST ARCHIVE</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080808;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans KR",Arial,sans-serif;
}

header{
  padding:26px 22px;
  border-bottom:1px solid #242424;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

header b{color:#ff3045}

main{
  max-width:760px;
  margin:auto;
  padding:0 22px 60px;
}

/* HERO */

.hero{padding:55px 0 45px}

.yb-logo{
  display:block;
  width:90px;
  height:auto;
  margin-bottom:32px;
}

.hero small{
  display:block;
  color:#777;
  font-size:14px;
  margin-bottom:16px;
}

.hero h1{
  margin:0;
  font-size:46px;
  line-height:1.02;
  letter-spacing:-2px;
}

.red{color:#ff3045}

.hero p{
  color:#8d8d8d;
  font-size:17px;
  line-height:1.8;
  margin:24px 0 0;
}

/* 통계 */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid #292929;
  border-bottom:1px solid #292929;
  margin-bottom:30px;
}

.stat{
  text-align:center;
  padding:24px 10px;
}

.stat+.stat{border-left:1px solid #292929}

.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:7px;
}

.stat span{
  color:#777;
  font-size:14px;
}

/* 검색 */

.search{
  width:100%;
  background:#171717;
  border:1px solid #444;
  color:white;
  padding:18px 20px;
  border-radius:40px;
  font-size:16px;
  outline:none;
}

.search::placeholder{color:#777}

/* 필터 */

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:17px 0 28px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{display:none}

.filters button{
  flex:none;
  border:1px solid #383838;
  background:#171717;
  color:#aaa;
  padding:12px 18px;
  border-radius:30px;
  font-size:15px;
}

.filters button.on{
  background:#ff3045;
  border-color:#ff3045;
  color:white;
}

/* 곡별 공연 횟수 버튼 */

.song-stats-link{
  border:1px solid #333;
  border-radius:15px;
  padding:21px 20px;
  margin:0 0 42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  background:#0c0c0c;
}

.song-stats-link:active{
  background:#151515;
}

.song-stats-link strong{
  font-size:18px;
}

.song-stats-link span{
  color:#ff3045;
  font-size:26px;
}

/* 공연 목록 */

.section-title{
  font-size:27px;
  margin:0 0 24px;
}

.card{
  border:1px solid #292929;
  border-radius:15px;
  padding:22px;
  margin-bottom:14px;
  cursor:pointer;
  background:#0c0c0c;
}

.card:active{background:#151515}

.card .date{
  color:#ff3045;
  font-size:14px;
  font-weight:700;
  margin-bottom:9px;
}

.card h3{
  margin:0 0 9px;
  font-size:20px;
}

.card p{
  margin:0;
  color:#777;
  font-size:14px;
  line-height:1.6;
}

.empty{
  color:#777;
  padding:20px 0;
}

/* 공연 상세 */

#detail,
#songStats,
#songDetail{
  display:none;
  padding-top:38px;
}

.back{
  color:#aaa;
  font-size:17px;
  margin-bottom:35px;
  cursor:pointer;
  display:inline-block;
}

.detail-date{
  color:#ff3045;
  font-size:15px;
  font-weight:700;
  margin-bottom:18px;
}

#detail h1{
  font-size:32px;
  line-height:1.25;
  margin:0 0 20px;
}

.detail-info{
  color:#888;
  font-size:15px;
  line-height:1.8;
  margin-bottom:28px;
}

.performance-image{
  width:100%;
  display:block;
  border-radius:14px;
  margin:0 0 42px;
  max-height:520px;
  object-fit:cover;
}

.set-title{
  font-size:25px;
  margin-bottom:18px;
}

.song{
  display:flex;
  align-items:center;
  border-top:1px solid #292929;
  padding:18px 0;
}

.song:last-child{
  border-bottom:1px solid #292929;
}

.song-num{
  color:#ff3045;
  width:48px;
  flex:none;
  font-size:17px;
  font-weight:700;
}

.song-name{
  font-size:17px;
}

/* 곡별 통계 */

.stats-kicker{
  color:#ff3045;
  font-size:15px;
  font-weight:800;
  margin-bottom:17px;
}

.stats-title{
  font-size:40px;
  margin:0 0 20px;
  letter-spacing:-1.5px;
}

.stats-desc{
  color:#777;
  font-size:16px;
  line-height:1.8;
  margin:0 0 35px;
}

.song-rank{
  display:flex;
  align-items:center;
  border-top:1px solid #292929;
  padding:20px 4px;
  cursor:pointer;
}

.song-rank:last-child{
  border-bottom:1px solid #292929;
}

.song-rank:active{
  background:#111;
}

.rank-num{
  width:47px;
  color:#555;
  font-weight:700;
  font-size:16px;
  flex:none;
}

.rank-name{
  flex:1;
  font-size:17px;
  font-weight:700;
  padding-right:10px;
}

.rank-count{
  color:#ff3045;
  font-size:17px;
  font-weight:800;
  flex:none;
}

/* 특정 곡 상세 */

.song-detail-title{
  font-size:40px;
  margin:0 0 28px;
  letter-spacing:-1.5px;
}

.song-detail-count{
  color:#ff3045;
  font-size:19px;
  font-weight:800;
  margin-bottom:38px;
}

.song-performance{
  padding:20px 2px;
  border-top:1px solid #292929;
  cursor:pointer;
}

.song-performance:last-child{
  border-bottom:1px solid #292929;
}

.song-performance:active{
  background:#111;
}

.song-performance .sp-date{
  color:#ff3045;
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.song-performance h3{
  font-size:18px;
  line-height:1.45;
  margin:0 0 8px;
}

.song-performance p{
  color:#666;
  font-size:14px;
  line-height:1.6;
  margin:0;
}

/* 푸터 */

footer{
  max-width:760px;
  margin:auto;
  padding:30px 22px 45px;
  color:#555;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  YB <b>SETLIST</b> ARCHIVE
</header>

<main>

<!-- 메인 -->
<section id="home">

  <div class="hero">

    <img
      src="yb.logo.png"
      alt="YB Logo"
      class="yb-logo"
    >

    <small>2026 YB PERFORMANCE ARCHIVE</small>

    <h1>
      LIVE SETLIST<br>
      <span class="red">ARCHIVE.</span>
    </h1>

    <p>
      2026년 YB 공연 셋리스트를 기록합니다.<br>
      공연명 또는 곡명으로 찾아보세요.
    </p>

  </div>

  <div class="stats">

    <div class="stat">
      <strong id="cc">0</strong>
      <span>등록 공연</span>
    </div>

    <div class="stat">
      <strong id="sc">0</strong>
      <span>수록 곡</span>
    </div>

  </div>

  <input
    id="q"
    class="search"
    placeholder="곡명 또는 공연명을 검색하세요"
  >

  <div class="filters">

    <button class="on" onclick="ft('전체',this)">
      전체
    </button>

    <button onclick="ft('단독공연',this)">
      단독공연
    </button>

    <button onclick="ft('페스티벌',this)">
      페스티벌
    </button>

    <button onclick="ft('대학축제',this)">
      대학축제
    </button>

    <button onclick="ft('행사',this)">
      행사
    </button>

  </div>

  <div class="song-stats-link" onclick="openSongStats()">
    <strong>곡별 공연 횟수</strong>
    <span>→</span>
  </div>

  <h2 class="section-title">
    공연 기록
  </h2>

  <div id="list"></div>

</section>


<!-- 공연 상세 -->
<section id="detail">

  <div class="back" onclick="goHome()">
    ← 공연 목록
  </div>

  <div id="dd" class="detail-date"></div>

  <h1 id="dt"></h1>

  <div id="dm" class="detail-info"></div>

  <img
    id="performanceImage"
    class="performance-image"
    alt="공연 대표 이미지"
  >

  <h2 class="set-title">
    SETLIST
  </h2>

  <div id="songs"></div>

</section>


<!-- 곡별 통계 -->
<section id="songStats">

  <div class="back" onclick="goHome()">
    ← 메인으로
  </div>

  <div class="stats-kicker">
    2026 YB SETLIST
  </div>

  <h1 class="stats-title">
    곡별 공연 횟수
  </h1>

  <p class="stats-desc">
    2026년 등록된 공연을 기준으로 계산합니다.<br>
    곡을 누르면 해당 곡의 공연 기록을 볼 수 있습니다.
  </p>

  <div id="songRanking"></div>

</section>


<!-- 특정 곡 공연 목록 -->
<section id="songDetail">

  <div class="back" onclick="openSongStats()">
    ← 곡별 통계
  </div>

  <h1 id="selectedSong" class="song-detail-title"></h1>

  <div id="selectedCount" class="song-detail-count"></div>

  <div id="songPerformances"></div>

</section>

</main>

<footer>
  UNOFFICIAL YB FAN ARCHIVE
</footer>

/* 날짜 최신순 */

function dateKey(x){
  const m=x[0].match(/(\d{4})\.(\d{2})\.(\d{2})/);
  if(!m) return 0;
  return Number(m[1]+m[2]+m[3]);
}

data.sort((a,b)=>dateKey(b)-dateKey(a));


let type="전체";

const home=document.querySelector("#home");
const detail=document.querySelector("#detail");
const songStats=document.querySelector("#songStats");
const songDetail=document.querySelector("#songDetail");

const list=document.querySelector("#list");
const q=document.querySelector("#q");

const dd=document.querySelector("#dd");
const dt=document.querySelector("#dt");
const dm=document.querySelector("#dm");
const songs=document.querySelector("#songs");
const performanceImage=document.querySelector("#performanceImage");

const cc=document.querySelector("#cc");
const sc=document.querySelector("#sc");

const songRanking=document.querySelector("#songRanking");
const selectedSong=document.querySelector("#selectedSong");
const selectedCount=document.querySelector("#selectedCount");
const songPerformances=document.querySelector("#songPerformances");


function hideAll(){

  home.style.display="none";
  detail.style.display="none";
  songStats.style.display="none";
  songDetail.style.display="none";

}


/* 메인 공연 목록 */

function draw(){

  const k=q.value.toLowerCase();

  list.innerHTML="";

  data.forEach((x,i)=>{

    const searchText=(
      x[0]+" "+
      x[1]+" "+
      x[2]+" "+
      x[3]+" "+
      x[4]+" "+
      x[6].join(" ")
    ).toLowerCase();

    if(
      (type==="전체" || x[4]===type)
      &&
      searchText.includes(k)
    ){

      list.innerHTML+=`
        <div class="card" onclick="openC(${i})">

          <div class="date">
            ${x[0]}
          </div>

          <h3>
            ${x[1]}
          </h3>

          <p>
            ${x[2]} · ${x[3]} · ${x[4]}
          </p>

        </div>
      `;

    }

  });

  if(!list.innerHTML){
    list.innerHTML=
      '<p class="empty">검색 결과가 없습니다.</p>';
  }

}


function ft(t,b){

  type=t;

  document
    .querySelectorAll(".filters button")
    .forEach(x=>x.classList.remove("on"));

  b.classList.add("on");

  draw();

}


/* 공연 상세 */

function openC(i){

  const x=data[i];

  hideAll();

  detail.style.display="block";

  dd.innerText=x[0];
  dt.innerText=x[1];

  dm.innerHTML=
    `${x[2]}<br>${x[3]} · ${x[4]}`;

  performanceImage.src=x[5];

  songs.innerHTML=
    x[6]
      .map((s,n)=>`
        <div class="song">

          <div class="song-num">
            ${String(n+1).padStart(2,"0")}
          </div>

          <div class="song-name">
            ${s}
          </div>

        </div>
      `)
      .join("");

  window.scrollTo(0,0);

}


/* 메인으로 */

function goHome(){

  hideAll();

  home.style.display="block";

  window.scrollTo(0,0);

}


/* 곡별 횟수 계산 */

function getSongStats(){

  const counts={};

  data.forEach(show=>{

    /*
    같은 공연 안에 혹시 같은 곡이 두 번 적혀 있어도
    공연 횟수는 1회로 계산
    */

    const uniqueSongs=new Set(show[6]);

    uniqueSongs.forEach(song=>{

      if(!counts[song]){
        counts[song]=0;
      }

      counts[song]++;

    });

  });

  return Object.entries(counts)
    .sort((a,b)=>{

      if(b[1]!==a[1]){
        return b[1]-a[1];
      }

      return a[0].localeCompare(b[0],"ko");

    });

}


/* 곡별 통계 화면 */

function openSongStats(){

  hideAll();

  songStats.style.display="block";

  const stats=getSongStats();

  songRanking.innerHTML=
    stats.map((x,i)=>`

      <div
        class="song-rank"
        onclick='openSongDetail(${JSON.stringify(x[0])})'
      >

        <div class="rank-num">
          ${String(i+1).padStart(2,"0")}
        </div>

        <div class="rank-name">
          ${x[0]}
        </div>

        <div class="rank-count">
          ${x[1]}회
        </div>

      </div>

    `).join("");

  window.scrollTo(0,0);

}


/* 특정 곡 → 부른 공연들 */

function openSongDetail(song){

  hideAll();

  songDetail.style.display="block";

  const performances=[];

  data.forEach((x,i)=>{

    if(x[6].includes(song)){

      performances.push({
        index:i,
        data:x
      });

    }

  });

  selectedSong.innerText=song;

  selectedCount.innerText=
    `${performances.length}회 공연`;

  songPerformances.innerHTML=
    performances.map(p=>{

      const x=p.data;

      return `
        <div
          class="song-performance"
          onclick="openC(${p.index})"
        >

          <div class="sp-date">
            ${x[0]}
          </div>

          <h3>
            ${x[1]}
          </h3>

          <p>
            ${x[2]} · ${x[3]}
          </p>

        </div>
      `;

    }).join("");

  window.scrollTo(0,0);

}


/* 검색 */

q.oninput=draw;


/* 상단 숫자 자동 계산 */

cc.innerText=data.length;

sc.innerText=
  new Set(
    data.flatMap(x=>x[6])
  ).size;


/* 시작 */

draw();

</script>
