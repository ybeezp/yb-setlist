<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YB SETLIST ARCHIVE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:18px 20px;
  background:rgba(8,8,8,.94);
  border-bottom:1px solid #222;
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#ff2638;
}

main{
  max-width:700px;
  margin:auto;
  padding:34px 20px 70px;
}

.hero{
  padding:35px 0 42px;
}

.hero-small{
  color:#999;
  font-size:14px;
  margin-bottom:12px;
}

.hero h1{
  font-size:43px;
  line-height:.98;
  letter-spacing:-2px;
}

.hero h1 span{
  color:#ff2638;
}

.hero p{
  margin-top:20px;
  color:#aaa;
  line-height:1.7;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin:10px 0 35px;
  border-top:1px solid #292929;
  border-bottom:1px solid #292929;
}

.stat{
  text-align:center;
  padding:20px 5px;
}

.stat:not(:last-child){
  border-right:1px solid #292929;
}

.stat strong{
  display:block;
  font-size:23px;
}

.stat span{
  font-size:11px;
  color:#888;
}

.search{
  width:100%;
  background:#161616;
  border:1px solid #444;
  border-radius:50px;
  padding:17px 20px;
  color:white;
  font-size:15px;
